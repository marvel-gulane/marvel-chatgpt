<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neon Tetris — Human vs AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #050816;
    --panel: rgba(10, 16, 40, .78);
    --cyan: #00f6ff;
    --pink: #ff2bd6;
    --purple: #8b5cff;
    --green: #20ff9a;
    --yellow: #ffe600;
    --text: #eef7ff;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #18245c 0, transparent 30%),
        radial-gradient(circle at 80% 70%, #32105d 0, transparent 35%),
        linear-gradient(135deg, #03040c, #090d25 50%, #05030d);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 35px 35px;
    mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
}

.app {
    width: min(1250px, 96%);
    margin: auto;
    padding: 24px 0 35px;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

.logo {
    font-size: clamp(34px, 6vw, 70px);
    font-weight: 1000;
    letter-spacing: 8px;
    color: white;
    text-shadow:
        0 0 5px white,
        0 0 15px var(--cyan),
        0 0 35px var(--cyan),
        0 0 70px var(--pink);
    animation: logoPulse 2s infinite alternate;
}

.subtitle {
    color: #9aa8c7;
    letter-spacing: 4px;
    margin-top: 5px;
    text-transform: uppercase;
}

@keyframes logoPulse {
    from { filter: brightness(.9); }
    to { filter: brightness(1.3); }
}

.topbar {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

button,
select {
    border: 1px solid rgba(0,246,255,.4);
    background: rgba(7,14,35,.9);
    color: white;
    padding: 11px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

button:hover,
select:hover {
    transform: translateY(-2px);
    border-color: var(--cyan);
    box-shadow: 0 0 18px rgba(0,246,255,.35);
}

button.primary {
    background: linear-gradient(135deg, #008fa8, #7c2cff);
    border-color: transparent;
}

.game {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 22px;
    align-items: start;
}

.player {
    background: var(--panel);
    border: 1px solid rgba(0,246,255,.2);
    border-radius: 20px;
    padding: 15px;
    box-shadow:
        0 0 30px rgba(0,246,255,.08),
        inset 0 0 30px rgba(255,255,255,.015);
    backdrop-filter: blur(14px);
}

.player.ai {
    border-color: rgba(255,43,214,.25);
    box-shadow:
        0 0 30px rgba(255,43,214,.08),
        inset 0 0 30px rgba(255,255,255,.015);
}

.player-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.player-title h2 {
    font-size: 18px;
    letter-spacing: 2px;
}

.badge {
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 99px;
    background: rgba(0,246,255,.1);
    color: var(--cyan);
    border: 1px solid rgba(0,246,255,.25);
}

.ai .badge {
    color: var(--pink);
    background: rgba(255,43,214,.1);
    border-color: rgba(255,43,214,.25);
}

.board-wrap {
    position: relative;
    width: min(34vw, 300px);
    aspect-ratio: 1 / 2;
    margin: auto;
}

canvas.board {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 9px;
    background: #02040c;
    border: 2px solid rgba(0,246,255,.5);
    box-shadow:
        0 0 12px rgba(0,246,255,.3),
        inset 0 0 35px rgba(0,0,0,.8);
}

.ai canvas.board {
    border-color: rgba(255,43,214,.5);
    box-shadow:
        0 0 12px rgba(255,43,214,.3),
        inset 0 0 35px rgba(0,0,0,.8);
}

.overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: .25s;
    background: rgba(2,4,12,.68);
    border-radius: 8px;
}

.overlay.show {
    opacity: 1;
}

.overlay div {
    padding: 20px;
}

.overlay h3 {
    font-size: 28px;
    text-shadow: 0 0 20px var(--cyan);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 12px;
}

.stat {
    text-align: center;
    background: rgba(255,255,255,.035);
    border-radius: 9px;
    padding: 8px 4px;
}

.stat span {
    display: block;
    font-size: 10px;
    color: #8190ad;
    text-transform: uppercase;
}

.stat strong {
    display: block;
    margin-top: 3px;
    color: white;
}

.center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    padding-top: 8px;
}

.vs {
    font-size: 38px;
    font-weight: 1000;
    color: white;
    text-shadow:
        0 0 10px var(--pink),
        0 0 30px var(--cyan);
    animation: vs 1.2s infinite alternate;
}

@keyframes vs {
    from { transform: scale(.95); }
    to { transform: scale(1.08); }
}

.next-hold {
    display: flex;
    gap: 10px;
}

.mini {
    width: 105px;
    padding: 10px;
    text-align: center;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
}

.mini h4 {
    color: #8492b0;
    font-size: 10px;
    margin-bottom: 5px;
    letter-spacing: 2px;
}

canvas.miniCanvas {
    width: 80px;
    height: 60px;
}

.status {
    min-width: 150px;
    text-align: center;
    padding: 11px;
    border-radius: 10px;
    background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.07);
    color: #a9b8d3;
    font-size: 12px;
}

.controls {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px;
}

.key {
    min-width: 42px;
    padding: 8px 10px;
    border-radius: 7px;
    background: #0c1430;
    border: 1px solid #26365f;
    color: #b9c7e2;
    text-align: center;
    font-size: 11px;
}

.key b {
    color: white;
}

#particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
}

.mobile-controls {
    display: none;
    margin: 15px auto 0;
    max-width: 300px;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.mobile-controls button {
    padding: 14px;
    font-size: 18px;
}

.mobile-controls .wide {
    grid-column: span 3;
}

@media(max-width: 900px) {
    .game {
        grid-template-columns: 1fr 1fr;
    }

    .center {
        grid-column: span 2;
        grid-row: 1;
        flex-direction: row;
        justify-content: center;
    }

    .board-wrap {
        width: min(42vw, 300px);
    }
}

@media(max-width: 620px) {
    .game {
        grid-template-columns: 1fr;
    }

    .center {
        grid-column: auto;
        grid-row: auto;
    }

    .board-wrap {
        width: min(75vw, 300px);
    }

    .controls {
        display: none;
    }

    .mobile-controls {
        display: grid;
    }

    .logo {
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="app">

<header>
    <div class="logo">NEON TETRIS</div>
    <div class="subtitle">Human vs Artificial Intelligence</div>
</header>

<div class="topbar">
    <button class="primary" id="startBtn">▶ START MATCH</button>
    <button id="pauseBtn">Ⅱ PAUSE</button>
    <button id="resetBtn">↻ RESET</button>

    <select id="difficulty">
        <option value="easy">AI: EASY</option>
        <option value="normal" selected>AI: NORMAL</option>
        <option value="hard">AI: HARD</option>
        <option value="insane">AI: INSANE</option>
    </select>
</div>

<div class="game">

    <!-- HUMAN -->
    <section class="player">
        <div class="player-title">
            <h2>👤 HUMAN</h2>
            <span class="badge">PLAYER 1</span>
        </div>

        <div class="board-wrap">
            <canvas id="humanBoard" class="board" width="300" height="600"></canvas>

            <div id="humanOverlay" class="overlay show">
                <div>
                    <h3>READY?</h3>
                    <p>Press START</p>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <span>Score</span>
                <strong id="humanScore">0</strong>
            </div>
            <div class="stat">
                <span>Lines</span>
                <strong id="humanLines">0</strong>
            </div>
            <div class="stat">
                <span>Level</span>
                <strong id="humanLevel">1</strong>
            </div>
        </div>
    </section>

    <!-- CENTER -->
    <section class="center">

        <div class="next-hold">
            <div class="mini">
                <h4>HOLD</h4>
                <canvas id="holdCanvas" class="miniCanvas" width="100" height="70"></canvas>
            </div>

            <div class="mini">
                <h4>NEXT</h4>
                <canvas id="nextCanvas" class="miniCanvas" width="100" height="70"></canvas>
            </div>
        </div>

        <div class="vs">VS</div>

        <div class="status" id="status">
            Waiting for match...
        </div>

        <div class="status">
            AI: <strong id="aiName">NORMAL</strong>
        </div>
    </section>

    <!-- AI -->
    <section class="player ai">
        <div class="player-title">
            <h2>🤖 AI</h2>
            <span class="badge">COMPUTER</span>
        </div>

        <div class="board-wrap">
            <canvas id="aiBoard" class="board" width="300" height="600"></canvas>

            <div id="aiOverlay" class="overlay show">
                <div>
                    <h3>AI OFFLINE</h3>
                    <p>Waiting...</p>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <span>Score</span>
                <strong id="aiScore">0</strong>
            </div>
            <div class="stat">
                <span>Lines</span>
                <strong id="aiLines">0</strong>
            </div>
            <div class="stat">
                <span>Level</span>
                <strong id="aiLevel">1</strong>
            </div>
        </div>
    </section>

</div>

<div class="controls">
    <div class="key"><b>←</b> LEFT</div>
    <div class="key"><b>→</b> RIGHT</div>
    <div class="key"><b>↑</b> ROTATE</div>
    <div class="key"><b>↓</b> SOFT DROP</div>
    <div class="key"><b>SPACE</b> HARD DROP</div>
    <div class="key"><b>C</b> HOLD</div>
    <div class="key"><b>P</b> PAUSE</div>
</div>

<div class="mobile-controls">
    <button data-action="left">←</button>
    <button data-action="rotate">↻</button>
    <button data-action="right">→</button>
    <button data-action="down">↓</button>
    <button data-action="drop">DROP</button>
    <button data-action="hold">HOLD</button>
    <button class="wide" data-action="pause">PAUSE</button>
</div>

</div>

<script>
/* =========================================================
   NEON TETRIS — HUMAN VS AI
   Single-file HTML / CSS / JavaScript
   ========================================================= */

const COLS = 10;
const ROWS = 20;
const BLOCK = 30;

const COLORS = {
    I: "#00f6ff",
    O: "#ffe600",
    T: "#b35cff",
    S: "#20ff9a",
    Z: "#ff3864",
    J: "#387cff",
    L: "#ff9b30"
};

const PIECES = {
    I: [
        [1,1,1,1]
    ],
    O: [
        [1,1],
        [1,1]
    ],
    T: [
        [0,1,0],
        [1,1,1]
    ],
    S: [
        [0,1,1],
        [1,1,0]
    ],
    Z: [
        [1,1,0],
        [0,1,1]
    ],
    J: [
        [1,0,0],
        [1,1,1]
    ],
    L: [
        [0,0,1],
        [1,1,1]
    ]
};

const TYPES = Object.keys(PIECES);

function cloneMatrix(m) {
    return m.map(row => [...row]);
}

function rotateMatrix(matrix) {
    const N = matrix.length;
    const M = matrix[0].length;

    const result = Array.from(
        {length: M},
        () => Array(N).fill(0)
    );

    for (let y = 0; y < N; y++) {
        for (let x = 0; x < M; x++) {
            result[x][N - 1 - y] = matrix[y][x];
        }
    }

    return result;
}

function randomType() {
    return TYPES[Math.floor(Math.random() * TYPES.length)];
}

function createPiece(type = randomType()) {
    return {
        type,
        matrix: cloneMatrix(PIECES[type]),
        x: Math.floor((COLS - PIECES[type][0].length) / 2),
        y: 0
    };
}

function createBoard() {
    return Array.from(
        {length: ROWS},
        () => Array(COLS).fill(null)
    );
}

function valid(board, piece) {
    for (let y = 0; y < piece.matrix.length; y++) {
        for (let x = 0; x < piece.matrix[y].length; x++) {

            if (!piece.matrix[y][x]) continue;

            const bx = piece.x + x;
            const by = piece.y + y;

            if (bx < 0 || bx >= COLS || by >= ROWS) {
                return false;
            }

            if (by >= 0 && board[by][bx]) {
                return false;
            }
        }
    }

    return true;
}

function merge(board, piece) {
    piece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value) {
                const by = piece.y + y;
                const bx = piece.x + x;

                if (by >= 0) {
                    board[by][bx] = piece.type;
                }
            }
        });
    });
}

function clearLines(board) {
    let cleared = 0;

    for (let y = ROWS - 1; y >= 0; y--) {
        if (board[y].every(Boolean)) {
            board.splice(y, 1);
            board.unshift(Array(COLS).fill(null));
            cleared++;
            y++;
        }
    }

    return cleared;
}

function addGarbage(board, amount) {
    for (let i = 0; i < amount; i++) {
        board.shift();

        const hole = Math.floor(Math.random() * COLS);

        const row = Array(COLS).fill("G");
        row[hole] = null;

        board.push(row);
    }
}

/* =========================================================
   PARTICLES
   ========================================================= */

const particleCanvas = document.getElementById("particles");
const particleCtx = particleCanvas.getContext("2d");

let particles = [];

function resizeParticles() {
    particleCanvas.width = innerWidth;
    particleCanvas.height = innerHeight;
}

resizeParticles();
addEventListener("resize", resizeParticles);

function burst(x, y, color = "#00f6ff", amount = 25) {
    for (let i = 0; i < amount; i++) {
        particles.push({
            x,
            y,
            vx: (Math.random() - .5) * 8,
            vy: (Math.random() - .5) * 8,
            life: 1,
            color
        });
    }
}

function particleLoop() {
    particleCtx.clearRect(
        0,
        0,
        particleCanvas.width,
        particleCanvas.height
    );

    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += .12;
        p.life -= .025;

        particleCtx.globalAlpha = Math.max(0, p.life);
        particleCtx.fillStyle = p.color;
        particleCtx.shadowBlur = 12;
        particleCtx.shadowColor = p.color;

        particleCtx.fillRect(p.x, p.y, 4, 4);
    });

    particles = particles.filter(p => p.life > 0);

    requestAnimationFrame(particleLoop);
}

particleLoop();

/* =========================================================
   BOARD RENDERER
   ========================================================= */

function setupCanvas(canvas) {
    const ctx = canvas.getContext("2d");
    return ctx;
}

const humanCanvas = document.getElementById("humanBoard");
const aiCanvas = document.getElementById("aiBoard");

const humanCtx = setupCanvas(humanCanvas);
const aiCtx = setupCanvas(aiCanvas);

function drawBlock(ctx, x, y, color, size = BLOCK, ghost = false) {
    const px = x * size;
    const py = y * size;

    ctx.save();

    if (ghost) {
        ctx.globalAlpha = .18;
        ctx.fillStyle = color;
        ctx.fillRect(px + 3, py + 3, size - 6, size - 6);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 3, py + 3, size - 6, size - 6);
        ctx.restore();
        return;
    }

    ctx.shadowBlur = 13;
    ctx.shadowColor = color;

    const gradient = ctx.createLinearGradient(
        px,
        py,
        px + size,
        py + size
    );

    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(.12, color);
    gradient.addColorStop(1, color);

    ctx.fillStyle = gradient;
    ctx.fillRect(px + 2, py + 2, size - 4, size - 4);

    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillRect(px + 4, py + 4, size - 8, 4);

    ctx.restore();
}

function drawBoard(ctx, board, activePiece, ghostPiece) {
    ctx.clearRect(0, 0, 300, 600);

    ctx.fillStyle = "#02040c";
    ctx.fillRect(0, 0, 300, 600);

    // grid
    ctx.strokeStyle = "rgba(255,255,255,.035)";
    ctx.lineWidth = 1;

    for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * BLOCK, 0);
        ctx.lineTo(x * BLOCK, 600);
        ctx.stroke();
    }

    for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * BLOCK);
        ctx.lineTo(300, y * BLOCK);
        ctx.stroke();
    }

    board.forEach((row, y) => {
        row.forEach((type, x) => {
            if (type) {
                drawBlock(
                    ctx,
                    x,
                    y,
                    type === "G" ? "#58647d" : COLORS[type]
                );
            }
        });
    });

    if (ghostPiece) {
        ghostPiece.matrix.forEach((row, y) => {
            row.forEach((v, x) => {
                if (v) {
                    drawBlock(
                        ctx,
                        ghostPiece.x + x,
                        ghostPiece.y + y,
                        COLORS[ghostPiece.type],
                        BLOCK,
                        true
                    );
                }
            });
        });
    }

    if (activePiece) {
        activePiece.matrix.forEach((row, y) => {
            row.forEach((v, x) => {
                if (v) {
                    drawBlock(
                        ctx,
                        activePiece.x + x,
                        activePiece.y + y,
                        COLORS[activePiece.type]
                    );
                }
            });
        });
    }
}

function getGhost(board, piece) {
    const ghost = {
        type: piece.type,
        matrix: cloneMatrix(piece.matrix),
        x: piece.x,
        y: piece.y
    };

    while (valid(board, ghost)) {
        ghost.y++;
    }

    ghost.y--;

    return ghost;
}

/* =========================================================
   MINI PREVIEWS
   ========================================================= */

const holdCtx = document.getElementById("holdCanvas").getContext("2d");
const nextCtx = document.getElementById("nextCanvas").getContext("2d");

function drawMini(ctx, type) {
    ctx.clearRect(0, 0, 100, 70);

    if (!type) return;

    const matrix = PIECES[type];
    const size = 18;

    const width = matrix[0].length * size;
    const height = matrix.length * size;

    const ox = (100 - width) / 2;
    const oy = (70 - height) / 2;

    matrix.forEach((row, y) => {
        row.forEach((v, x) => {
            if (!v) return;

            const px = ox + x * size;
            const py = oy + y * size;

            ctx.fillStyle = COLORS[type];
            ctx.shadowBlur = 10;
            ctx.shadowColor = COLORS[type];
            ctx.fillRect(px + 2, py + 2, size - 4, size - 4);
            ctx.shadowBlur = 0;
        });
    });
}

/* =========================================================
   GAME CLASS
   ========================================================= */

class TetrisGame {

    constructor(name, ctx) {
        this.name = name;
        this.ctx = ctx;

        this.board = createBoard();

        this.active = null;
        this.next = randomType();
        this.hold = null;

        this.score = 0;
        this.lines = 0;
        this.level = 1;

        this.dropCounter = 0;
        this.lastTime = 0;

        this.running = false;
        this.gameOver = false;
        this.canHold = true;
    }

    start() {
        this.board = createBoard();
        this.score = 0;
        this.lines = 0;
        this.level = 1;
        this.next = randomType();
        this.hold = null;
        this.gameOver = false;
        this.running = true;
        this.canHold = true;

        this.spawn();
        this.updateUI();
    }

    spawn() {
        this.active = createPiece(this.next);
        this.next = randomType();
        this.canHold = true;

        if (!valid(this.board, this.active)) {
            this.gameOver = true;
            this.running = false;
        }
    }

    move(dx) {
        if (!this.running || !this.active) return;

        this.active.x += dx;

        if (!valid(this.board, this.active)) {
            this.active.x -= dx;
        }
    }

    rotate() {
        if (!this.running || !this.active) return;

        const old = this.active.matrix;

        this.active.matrix = rotateMatrix(this.active.matrix);

        const kicks = [0, -1, 1, -2, 2];

        let success = false;

        for (const kick of kicks) {
            this.active.x += kick;

            if (valid(this.board, this.active)) {
                success = true;
                break;
            }

            this.active.x -= kick;
        }

        if (!success) {
            this.active.matrix = old;
        }
    }

    softDrop() {
        if (!this.running || !this.active) return;

        this.active.y++;

        if (!valid(this.board, this.active)) {
            this.active.y--;
            this.lock();
        }
    }

    hardDrop() {
        if (!this.running || !this.active) return;

        let distance = 0;

        while (valid(this.board, this.active)) {
            this.active.y++;
            distance++;
        }

        this.active.y--;
        distance--;

        this.score += Math.max(0, distance * 2);

        this.lock();
    }

    holdPiece() {
        if (!this.running || !this.active || !this.canHold) return;

        const current = this.active.type;

        if (!this.hold) {
            this.hold = current;
            this.spawn();
        } else {
            const temp = this.hold;
            this.hold = current;

            this.active = createPiece(temp);

            if (!valid(this.board, this.active)) {
                this.gameOver = true;
                this.running = false;
            }
        }

        this.canHold = false;
    }

    lock() {
        merge(this.board, this.active);

        const lines = clearLines(this.board);

        if (lines) {
            this.lines += lines;

            const points = [0, 100, 300, 500, 800][lines] * this.level;
            this.score += points;

            if (lines >= 2) {
                burst(
                    innerWidth / 2,
                    innerHeight / 2,
                    this.name === "human" ? "#00f6ff" : "#ff2bd6",
                    lines * 15
                );
            }
        }

        this.level = Math.floor(this.lines / 10) + 1;

        this.spawn();
        this.updateUI();

        return lines;
    }

    dropInterval() {
        return Math.max(
            80,
            850 - (this.level - 1) * 65
        );
    }

    update(time = 0) {
        if (!this.running) return;

        const delta = time - this.lastTime;
        this.lastTime = time;

        this.dropCounter += delta;

        if (this.dropCounter > this.dropInterval()) {
            this.softDrop();
            this.dropCounter = 0;
        }
    }

    updateUI() {
        const prefix = this.name;

        document.getElementById(prefix + "Score").textContent =
            this.score.toLocaleString();

        document.getElementById(prefix + "Lines").textContent =
            this.lines;

        document.getElementById(prefix + "Level").textContent =
            this.level;
    }

    render() {
        const ghost =
            this.active && this.running
                ? getGhost(this.board, this.active)
                : null;

        drawBoard(
            this.ctx,
            this.board,
            this.active,
            ghost
        );
    }
}

/* =========================================================
   AI
   ========================================================= */

class TetrisAI extends TetrisGame {

    constructor(ctx) {
        super("ai", ctx);
        this.target = null;
        this.thinking = false;
        this.aiTimer = 0;
        this.difficulty = "normal";
    }

    start() {
        super.start();
        this.target = null;
        this.thinking = false;
    }

    chooseMove() {
        if (!this.active || !this.running) return;

        const type = this.active.type;

        let best = null;
        let bestScore = -Infinity;

        let matrix = cloneMatrix(PIECES[type]);

        const rotations = [];

        for (let r = 0; r < 4; r++) {
            const key = JSON.stringify(matrix);

            if (!rotations.some(x => x.key === key)) {
                rotations.push({
                    matrix: cloneMatrix(matrix),
                    key
                });
            }

            matrix = rotateMatrix(matrix);
        }

        for (const rotation of rotations) {

            const width = rotation.matrix[0].length;

            for (let x = -2; x <= COLS - width + 2; x++) {

                let y = 0;

                const test = {
                    type,
                    matrix: cloneMatrix(rotation.matrix),
                    x,
                    y
                };

                while (valid(this.board, test)) {
                    test.y++;
                }

                test.y--;

                if (!valid(this.board, test)) continue;

                const simulated = this.board.map(row => [...row]);

                merge(simulated, test);

                const linesBefore = simulated.length;
                const cleared = clearLines(simulated);

                const evaluation =
                    this.evaluate(simulated, cleared);

                if (evaluation > bestScore) {
                    bestScore = evaluation;

                    best = {
                        x,
                        matrix: cloneMatrix(rotation.matrix)
                    };
                }
            }
        }

        if (best) {
            this.target = best;
        }
    }

    evaluate(board, lines) {

        const heights = [];
        let holes = 0;
        let aggregateHeight = 0;
        let bumpiness = 0;

        for (let x = 0; x < COLS; x++) {

            let y = 0;

            while (
                y < ROWS &&
                !board[y][x]
            ) {
                y++;
            }

            const height = ROWS - y;

            heights[x] = height;
            aggregateHeight += height;

            let foundBlock = false;

            for (let yy = 0; yy < ROWS; yy++) {
                if (board[yy][x]) {
                    foundBlock = true;
                } else if (foundBlock) {
                    holes++;
                }
            }
        }

        for (let x = 0; x < COLS - 1; x++) {
            bumpiness += Math.abs(
                heights[x] - heights[x + 1]
            );
        }

        const maxHeight = Math.max(...heights);

        const weights = {
            easy: {
                lines: 0.65,
                holes: -0.55,
                height: -0.25,
                bump: -0.15
            },
            normal: {
                lines: 1.0,
                holes: -1.2,
                height: -0.55,
                bump: -0.3
            },
            hard: {
                lines: 1.3,
                holes: -2.2,
                height: -0.75,
                bump: -0.45
            },
            insane: {
                lines: 1.7,
                holes: -3.8,
                height: -1.0,
                bump: -0.65
            }
        };

        const w = weights[this.difficulty];

        return (
            lines * 10 * w.lines +
            holes * w.holes +
            aggregateHeight * w.height +
            bumpiness * w.bump +
            maxHeight * -0.25
        );
    }

    aiStep() {
        if (!this.running || !this.active) return;

        if (!this.target) {
            this.chooseMove();
        }

        if (!this.target) return;

        const target = this.target;

        // Rotate toward target.
        if (
            JSON.stringify(this.active.matrix) !==
            JSON.stringify(target.matrix)
        ) {
            this.rotate();
            return;
        }

        // Move horizontally.
        if (this.active.x < target.x) {
            this.move(1);
            return;
        }

        if (this.active.x > target.x) {
            this.move(-1);
            return;
        }

        // Drop.
        this.hardDrop();

        // Garbage attack.
        const lastLines = this.lines;

        if (this.lastKnownLines !== undefined) {
            const difference = this.lines - this.lastKnownLines;

            if (difference >= 2) {
                // Attack human.
                addGarbage(
                    human.board,
                    Math.min(4, difference - 1)
                );
            }
        }

        this.lastKnownLines = this.lines;
        this.target = null;
    }
}

/* =========================================================
   GAME SETUP
   ========================================================= */

const human = new TetrisGame(
    "human",
    humanCtx
);

const ai = new TetrisAI(
    aiCtx
);

let matchRunning = false;
let paused = false;
let animationId;

function startMatch() {
    human.start();
    ai.difficulty =
        document.getElementById("difficulty").value;

    ai.start();

    matchRunning = true;
    paused = false;

    document.getElementById("humanOverlay")
        .classList.remove("show");

    document.getElementById("aiOverlay")
        .classList.remove("show");

    document.getElementById("status").textContent =
        "MATCH IN PROGRESS";

    document.getElementById("aiName").textContent =
        ai.difficulty.toUpperCase();

    document.getElementById("startBtn").textContent =
        "↻ NEW MATCH";
}

function resetMatch() {
    matchRunning = false;
    paused = false;

    human.running = false;
    ai.running = false;

    human.board = createBoard();
    ai.board = createBoard();

    human.active = null;
    ai.active = null;

    human.score = human.lines = 0;
    ai.score = ai.lines = 0;

    human.level = ai.level = 1;

    human.updateUI();
    ai.updateUI();

    human.render();
    ai.render();

    document.getElementById("humanOverlay")
        .classList.add("show");

    document.getElementById("aiOverlay")
        .classList.add("show");

    document.getElementById("status").textContent =
        "Waiting for match...";

    document.getElementById("startBtn").textContent =
        "▶ START MATCH";

    drawMini(holdCtx, null);
    drawMini(nextCtx, null);
}

function togglePause() {
    if (!matchRunning) return;

    paused = !paused;

    human.running = !paused && !human.gameOver;
    ai.running = !paused && !ai.gameOver;

    document.getElementById("pauseBtn").textContent =
        paused ? "▶ RESUME" : "Ⅱ PAUSE";

    document.getElementById("status").textContent =
        paused ? "GAME PAUSED" : "MATCH IN PROGRESS";
}

document.getElementById("startBtn")
    .addEventListener("click", startMatch);

document.getElementById("resetBtn")
    .addEventListener("click", resetMatch);

document.getElementById("pauseBtn")
    .addEventListener("click", togglePause);

document.getElementById("difficulty")
    .addEventListener("change", e => {
        ai.difficulty = e.target.value;
        document.getElementById("aiName").textContent =
            ai.difficulty.toUpperCase();
    });

/* =========================================================
   HUMAN CONTROLS
   ========================================================= */

document.addEventListener("keydown", e => {

    if (!matchRunning) return;

    if (e.key.toLowerCase() === "p") {
        togglePause();
        return;
    }

    if (paused) return;

    switch (e.key) {

        case "ArrowLeft":
            e.preventDefault();
            human.move(-1);
            break;

        case "ArrowRight":
            e.preventDefault();
            human.move(1);
            break;

        case "ArrowUp":
            e.preventDefault();
            human.rotate();
            break;

        case "ArrowDown":
            e.preventDefault();
            human.softDrop();
            break;

        case " ":
            e.preventDefault();
            human.hardDrop();
            break;

        case "c":
        case "C":
            human.holdPiece();
            break;
    }
});

/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

document.querySelectorAll(".mobile-controls button")
    .forEach(button => {

        button.addEventListener("click", () => {

            const action = button.dataset.action;

            if (!matchRunning || paused) return;

            if (action === "left") human.move(-1);
            if (action === "right") human.move(1);
            if (action === "rotate") human.rotate();
            if (action === "down") human.softDrop();
            if (action === "drop") human.hardDrop();
            if (action === "hold") human.holdPiece();
            if (action === "pause") togglePause();
        });

    });

/* =========================================================
   MATCH LOGIC
   ========================================================= */

function checkWinner() {

    if (!matchRunning) return;

    if (human.gameOver || ai.gameOver) {

        matchRunning = false;

        human.running = false;
        ai.running = false;

        let message = "DRAW";

        if (human.gameOver && !ai.gameOver) {
            message = "🤖 AI WINS";
        }

        if (ai.gameOver && !human.gameOver) {
            message = "👤 HUMAN WINS";
        }

        if (human.gameOver && ai.gameOver) {
            if (human.score > ai.score) {
                message = "👤 HUMAN WINS";
            } else if (ai.score > human.score) {
                message = "🤖 AI WINS";
            }
        }

        document.getElementById("status").textContent =
            message;

        document.getElementById("humanOverlay")
            .classList.add("show");

        document.getElementById("aiOverlay")
            .classList.add("show");

        document.querySelector("#humanOverlay h3")
            .textContent = message;

        document.querySelector("#aiOverlay h3")
            .textContent = message;

        burst(
            innerWidth / 2,
            innerHeight / 2,
            message.includes("HUMAN")
                ? "#00f6ff"
                : "#ff2bd6",
            100
        );
    }
}

/* =========================================================
   RENDER LOOP
   ========================================================= */

let lastTime = 0;
let aiThinkCounter = 0;

function gameLoop(time = 0) {

    const delta = time - lastTime;
    lastTime = time;

    if (matchRunning && !paused) {

        human.update(time);

        ai.update(time);

        aiThinkCounter += delta;

        const speeds = {
            easy: 280,
            normal: 150,
            hard: 80,
            insane: 35
        };

        if (aiThinkCounter >
            speeds[ai.difficulty]) {

            ai.aiStep();
            aiThinkCounter = 0;
        }

        drawMini(
            holdCtx,
            human.hold
        );

        drawMini(
            nextCtx,
            human.next
        );

        checkWinner();
    }

    human.render();
    ai.render();

    animationId =
        requestAnimationFrame(gameLoop);
}

resetMatch();
gameLoop();

/* =========================================================
   NICE VISUAL EFFECT: BOARD FLASH
   ========================================================= */

function flashBoard(canvas, color) {
    canvas.style.boxShadow =
        `0 0 40px ${color}, 0 0 80px ${color}`;

    setTimeout(() => {
        canvas.style.boxShadow = "";
    }, 180);
}

/* Observe score changes and create flashes. */

let previousHumanLines = 0;
let previousAILines = 0;

setInterval(() => {

    if (human.lines > previousHumanLines) {
        flashBoard(humanCanvas, "#00f6ff");
        previousHumanLines = human.lines;
    }

    if (ai.lines > previousAILines) {
        flashBoard(aiCanvas, "#ff2bd6");
        previousAILines = ai.lines;
    }

}, 100);

/* =========================================================
   PREVENT SPACE FROM SCROLLING
   ========================================================= */

window.addEventListener("keydown", e => {
    if (e.code === "Space") {
        e.preventDefault();
    }
});
</script>
