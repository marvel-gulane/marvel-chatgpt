<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nation War RPG</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffcc00;
            margin-bottom: 20px;
        }

        .game-container {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .faction-card {
            flex: 1;
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .faction-card.player {
            border-color: #007bff;
        }

        .faction-card.enemy {
            border-color: #dc3545;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }

        .player h2 { color: #3399ff; }
        .enemy h2 { color: #ff4d4d; }

        .stat {
            font-size: 1.1rem;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #555;
        }

        .player button {
            background-color: #0056b3;
        }
        .player button:hover {
            background-color: #004085;
        }

        .btn-war {
            background-color: #dc3545 !important;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 15px;
        }
        .btn-war:hover {
            background-color: #a71d2a !important;
        }

        button:disabled {
            background-color: #333 !important;
            color: #777;
            cursor: not-allowed;
        }

        .log-container {
            margin-top: 20px;
            max-width: 900px;
            width: 100%;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        .log-title {
            font-weight: bold;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .logs {
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .log-entry {
            animation: fadeIn 0.3s ease;
        }
        .log-neutral { color: #bbb; }
        .log-success { color: #28a745; }
        .log-danger { color: #dc3545; }
        .log-warning { color: #ffc107; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>Nation vs Nation: Realm Conflict</h1>

    <div class="game-container">
        <!-- Player Nation -->
        <div class="faction-card player">
            <h2>Your Kingdom</h2>
            <div class="stat"><span>Gold:</span> <span id="p-gold">100</span></div>
            <div class="stat"><span>Food:</span> <span id="p-food">100</span></div>
            <div class="stat"><span>Soldiers:</span> <span id="p-soldiers">10</span></div>
            
            <div class="actions">
                <button onclick="farmFood()">Farm Food (+20 Food)</button>
                <button onclick="collectTax()">Collect Tax (+20 Gold)</button>
                <button onclick="trainSoldier()">Train Soldier (-15 Gold, -10 Food)</button>
                <button class="btn-war" id="btn-attack" onclick="launchAttack()">LAUNCH ATTACK!</button>
            </div>
        </div>

        <!-- Enemy Nation -->
        <div class="faction-card enemy">
            <h2>Rival Empire</h2>
            <div class="stat"><span>Gold:</span> <span id="e-gold">??</span></div>
            <div class="stat"><span>Food:</span> <span id="e-food">??</span></div>
            <div class="stat"><span>Soldiers:</span> <span id="e-soldiers">30</span></div>
            <div style="margin-top: 30px; color: #888; font-style: italic; text-align: center;">
                The Enemy builds resources and recruits troops every turn. Prepare your defenses!
            </div>
        </div>
    </div>

    <div class="log-container">
        <div class="log-title">Battle & Management Log</div>
        <div class="logs" id="log-box">
            <div class="log-entry log-neutral">Welcome, Commander. Build your army and conquer the Rival Empire.</div>
        </div>
    </div>

    <script>
        // Game State
        const player = {
            gold: 100,
            food: 100,
            soldiers: 10
        };

        const enemy = {
            gold: 150,
            food: 120,
            soldiers: 25
        };

        let gameOver = false;

        // Update UI Elements
        function updateUI() {
            document.getElementById('p-gold').innerText = player.gold;
            document.getElementById('p-food').innerText = player.food;
            document.getElementById('p-soldiers').innerText = player.soldiers;
            document.getElementById('e-soldiers').innerText = enemy.soldiers;

            if (player.soldiers <= 0 || enemy.soldiers <= 0) {
                endGame();
            }
        }

        // Add message to the visual log console
        function logMessage(text, type = 'neutral') {
            const logBox = document.getElementById('log-box');
            const entry = document.createElement('div');
            entry.classList.add('log-entry', `log-${type}`);
            entry.innerText = `[Turn Action] ${text}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Player Actions
        function farmFood() {
            if (gameOver) return;
            player.food += 20;
            logMessage("Your farmers harvested 20 food units.", "neutral");
            enemyTurn();
            updateUI();
        }

        function collectTax() {
            if (gameOver) return;
            player.gold += 20;
            logMessage("Your tax collectors gathered 20 gold pieces.", "neutral");
            enemyTurn();
            updateUI();
        }

        function trainSoldier() {
            if (gameOver) return;
            if (player.gold >= 15 && player.food >= 10) {
                player.gold -= 15;
                player.food -= 10;
                player.soldiers += 1;
                logMessage("A new soldier has joined your ranks! (-15 Gold, -10 Food)", "success");
                enemyTurn();
                updateUI();
            } else {
                logMessage("Not enough resources to train a soldier!", "warning");
            }
        }

        // Enemy AI Mechanics
        function enemyTurn() {
            if (gameOver) return;
            
            // AI Basic resource generation
            enemy.gold += Math.floor(Math.random() * 15) + 10;
            enemy.food += Math.floor(Math.random() * 15) + 10;

            // AI Decision logic
            if (enemy.gold >= 15 && enemy.food >= 10) {
                enemy.gold -= 15;
                enemy.food -= 10;
                enemy.soldiers += Math.floor(Math.random() * 2) + 1; // recruits 1 or 2 soldiers
                logMessage("Intelligence reports state the Rival Empire has reinforced their army.", "warning");
            }

            // Small chance enemy launches an ambush if they outnumber player heavily
            if (enemy.soldiers > player.soldiers * 2 && Math.random() > 0.7) {
                enemyAmbush();
            }
        }

        // War Mechanics
        function launchAttack() {
            if (gameOver) return;
            if (player.soldiers <= 0) {
                logMessage("You have no soldiers to march to battle!", "warning");
                return;
            }

            logMessage("⚔️ You marched your army into enemy territory! Battle commences...", "neutral");

            // Simple Battle simulation with variable dice rolls
            let playerRoll = Math.floor(Math.random() * player.soldiers) + Math.floor(player.soldiers / 2);
            let enemyRoll = Math.floor(Math.random() * enemy.soldiers) + Math.floor(enemy.soldiers / 2);

            let playerLosses = Math.floor(enemyRoll / 2);
            let enemyLosses = Math.floor(playerRoll / 2);

            // Avoid losing more than currently available
            playerLosses = Math.min(playerLosses, player.soldiers);
            enemyLosses = Math.min(enemyLosses, enemy.soldiers);

            player.soldiers -= playerLosses;
            enemy.soldiers -= enemyLosses;

            if (playerLosses < enemyLosses) {
                logMessage(`VICTORY! You dealt massive damage. Enemy lost ${enemyLosses} troops. You lost ${playerLosses}.`, "success");
