# ============================================================
# HACKABLE TMUX
# Dark / high contrast / color-vision-friendly
# No plugins. No external dependencies.
# ============================================================

# ------------------------------------------------------------
# General
# ------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g history-limit 50000
set -g mouse on

set -g focus-events on
set -g set-clipboard on

set -g escape-time 10
set -g repeat-time 500

# Faster refresh
set -g status-interval 1

# ------------------------------------------------------------
# Prefix
# ------------------------------------------------------------

# Ctrl+A is easier to reach than Ctrl+B
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ------------------------------------------------------------
# Reload config
# ------------------------------------------------------------

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ------------------------------------------------------------
# Splits
# ------------------------------------------------------------

# Easier split commands
bind | split-window -h
bind - split-window -v

# Keep current working directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ------------------------------------------------------------
# Pane navigation
# ------------------------------------------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Arrow keys also work
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# ------------------------------------------------------------
# Resize panes
# ------------------------------------------------------------

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Repeat resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ------------------------------------------------------------
# Windows
# ------------------------------------------------------------

# Number windows from 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber
set -g renumber-windows on

# Easy window switching
bind -r C-h previous-window
bind -r C-l next-window

bind -r 1 select-window -t 1
bind -r 2 select-window -t 2
bind -r 3 select-window -t 3
bind -r 4 select-window -t 4
bind -r 5 select-window -t 5
bind -r 6 select-window -t 6
bind -r 7 select-window -t 7
bind -r 8 select-window -t 8
bind -r 9 select-window -t 9

# ------------------------------------------------------------
# Copy mode
# ------------------------------------------------------------

setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode

# Paste tmux buffer
bind ] paste-buffer

# Vi-style copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ------------------------------------------------------------
# Browser <-> XTerm clipboard
# ------------------------------------------------------------

# Modern tmux clipboard integration.
#
# With set-clipboard on:
# tmux can communicate clipboard data through the terminal.
#
# Ctrl+Shift+C/V remain available to XTerm.

set -g set-clipboard on

# ------------------------------------------------------------
# Pane appearance
# ------------------------------------------------------------

set -g pane-border-style "fg=#263554"
set -g pane-active-border-style "fg=#22d3ee"

set -g display-panes-active-colour "#22d3ee"
set -g display-panes-colour "#596579"

# ------------------------------------------------------------
# Messages
# ------------------------------------------------------------

set -g message-style \
    "bg=#111b2f,fg=#e6edf3"

set -g message-command-style \
    "bg=#111b2f,fg=#67e8f9"

# ------------------------------------------------------------
# Status bar
# ------------------------------------------------------------

set -g status on
set -g status-position bottom
set -g status-justify left

set -g status-left-length 30
set -g status-right-length 100

set -g status-style \
    "bg=#0d1424,fg=#e6edf3"

# ------------------------------------------------------------
# Left status
# ------------------------------------------------------------

set -g status-left \
    "#[fg=#10141c,bg=#22d3ee,bold] TMUX #[fg=#22d3ee,bg=#0d1424] "

# ------------------------------------------------------------
# Window tabs
# ------------------------------------------------------------

setw -g window-status-format \
    "#[fg=#7f91b2,bg=#0d1424] #I #[fg=#596579]│ #[fg=#a9b7ce]#W "

setw -g window-status-current-format \
    "#[fg=#10141c,bg=#ffd166,bold] #I #[fg=#ffd166,bg=#111b2f]│ #[fg=#ffffff,bg=#111b2f,bold]#W "

# ------------------------------------------------------------
# Right status
# ------------------------------------------------------------

set -g status-right \
    "#[fg=#596579]│ #[fg=#67e8f9]#S #[fg=#596579]│ #[fg=#d9f99d]%H:%M #[fg=#596579]│ #[fg=#c084fc]%d-%b "

# ------------------------------------------------------------
# Pane borders / titles
# ------------------------------------------------------------

set -g pane-border-lines single

set -g pane-border-format \
    "#[fg=#596579] #{pane_index} #[fg=#7f91b2]#{pane_title}"

# ------------------------------------------------------------
# Activity notifications
# ------------------------------------------------------------

setw -g monitor-activity on
set -g visual-activity off

# ------------------------------------------------------------
# Automatic window naming
# ------------------------------------------------------------

setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# ------------------------------------------------------------
# Status refresh
# ------------------------------------------------------------

set -g status-interval 1

# ------------------------------------------------------------
# Terminal colors
# ------------------------------------------------------------

# Black
set -g status-style "bg=#0d1424,fg=#e6edf3"

# ------------------------------------------------------------
# HACK AREA
# ------------------------------------------------------------
#
# Add your own status modules here.
#
# Examples:
#
# set -g status-right \
#     "#[fg=#22d3ee]CPU #[fg=#e6edf3]... "
#
# Or add shell output:
#
# set -g status-right \
#     "#(uname -n) #[fg=#596579]│ %H:%M"
#
# You can build your own modules without installing plugins.
#
# ------------------------------------------------------------

# End

